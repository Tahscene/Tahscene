<svg width="1100" height="320" viewBox="0 0 1100 320" xmlns="http://www.w3.org/2000/svg"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1100" y2="320" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#ffeef5"/><stop offset="55%" stop-color="#fdf4f8"/><stop offset="100%" stop-color="#e0f5ea"/></linearGradient>
<linearGradient id="fw" x1="0" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#f2a6c8"/><stop offset="40%" stop-color="#1fa97a"/><stop offset="70%" stop-color="#b57edc"/><stop offset="100%" stop-color="#f2a6c8"/><animateTransform attributeName="gradientTransform" type="translate" values="-160 0;160 0;-160 0" dur="14s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="co" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#1fa97a" stop-opacity=".2"/><stop offset="60%" stop-color="#f2a6c8" stop-opacity=".12"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
<style>text{font-family:'Segoe UI',Arial,sans-serif}.t{font-weight:900;fill:#0f6b4f;letter-spacing:1px}.c{font-weight:800;letter-spacing:1px;fill:#141414}.fl{animation:u 7s ease-in-out infinite}@keyframes u{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-12px);opacity:1}}</style></defs>
<rect width="1100" height="320" rx="28" fill="url(#bg)"/>
<circle cx="550" cy="160" r="160" fill="url(#co)"><animate attributeName="r" values="144;166;144" dur="11s" repeatCount="indefinite"/></circle>
<rect x="6" y="6" width="1088" height="308" rx="25" fill="none" stroke="url(#fw)" stroke-width="4" stroke-dasharray="420 90" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-510" dur="16s" repeatCount="indefinite"/></rect>
<circle class="fl" cx="110" cy="64" r="6" fill="#e0689f" style="animation-delay:0s"/>
<circle class="fl" cx="990" cy="96" r="9" fill="#0f8a63" style="animation-delay:1.1s"/>
<circle class="fl" cx="165" cy="272" r="12" fill="#b57edc" style="animation-delay:2.2s"/>
<circle class="fl" cx="968" cy="250" r="6" fill="#e0689f" style="animation-delay:3.3s"/>
<circle class="fl" cx="550" cy="32" r="9" fill="#0f8a63" style="animation-delay:4.4s"/>
<text x="550" y="135" text-anchor="middle" class="t" font-size="56">Hi! It’s Tahsin</text>
<rect x="98" y="175" width="286" height="46" rx="23" fill="#fff" stroke="#0f8a63" stroke-width="2.5"/><text x="241" y="205" text-anchor="middle" class="c" font-size="20">TELCO ANALYTICS</text>
<rect x="400" y="175" width="317" height="46" rx="23" fill="#fff" stroke="#0f8a63" stroke-width="2.5"/><text x="558" y="205" text-anchor="middle" class="c" font-size="20">BANKING ANALYTICS</text>
<rect x="732" y="175" width="270" height="46" rx="23" fill="#fff" stroke="#0f8a63" stroke-width="2.5"/><text x="867" y="205" text-anchor="middle" class="c" font-size="20">AI DEVELOPMENT</text>
