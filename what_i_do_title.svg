<svg width="1000" height="120" viewBox="0 0 1000 120" xmlns="http://www.w3.org/2000/svg"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1000" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#ffeef5"/><stop offset="55%" stop-color="#fdf4f8"/><stop offset="100%" stop-color="#e0f5ea"/></linearGradient>
<linearGradient id="fw" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#f2a6c8"/><stop offset="40%" stop-color="#1fa97a"/><stop offset="70%" stop-color="#b57edc"/><stop offset="100%" stop-color="#f2a6c8"/><animateTransform attributeName="gradientTransform" type="translate" values="-160 0;160 0;-160 0" dur="14s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="co" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#1fa97a" stop-opacity=".2"/><stop offset="60%" stop-color="#f2a6c8" stop-opacity=".12"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
<style>text{font-family:'Segoe UI',Arial,sans-serif}.k{font-weight:800;letter-spacing:4px;fill:#7a4fb0}.t{font-weight:900;fill:#0f6b4f;letter-spacing:1px}.d{font-weight:700;fill:#2d2238}.c{font-weight:800;letter-spacing:1px;fill:#141414}.l{font-weight:700;fill:#141414}.h{font-weight:900;letter-spacing:3px;fill:#0f6b4f}.fl{animation:u 7s ease-in-out infinite}@keyframes u{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-12px);opacity:1}}</style></defs>
<rect width="1000" height="120" rx="26" fill="url(#bg)"/>
<circle cx="500.0" cy="60.0" r="60.0" fill="url(#co)"><animate attributeName="r" values="54.0;62.400000000000006;54.0" dur="11s" repeatCount="indefinite"/></circle>
<rect x="6" y="6" width="988" height="108" rx="23" fill="none" stroke="url(#fw)" stroke-width="4" stroke-dasharray="420 90" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-510" dur="16s" repeatCount="indefinite"/></rect>
